<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style><meta name="theme-color" content="#153564"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Campus Rosa Parks"><meta name="description" content="Portail d'informations scolaires Campus Rosa Parks"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><link rel="icon" type="image/png" href="icon-192.png"></head><body>
<title>Campus Rosa Parks — Nouveau design | Campus Rosa Parks — Portail scolaire</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Concept : portail d'établissement. Mobile d'abord, barre inférieure ; barre latérale au-delà de 900px.
   Palette imposée par le cahier des charges, police Inter, pastels par catégorie. */
:root{
  --brand:#173B70; --btn:#173B70; --accent:#2563EB; --focus:#2563EB;
  --bg:#F8FAFC; --card:#FFFFFF; --soft:#F1F5F9; --fg:#111827; --muted:#64748B;
  --line:#E2E8F0; --line-strong:#CBD5E1; --brand-text:#173B70;
  --ok:#16A34A; --ok-bg:#DCFCE7; --warn:#F59E0B; --warn-bg:#FEF3C7; --warn-fg:#92400E; --err:#DC2626; --err-bg:#FEE2E2;
  --shadow:0 1px 2px rgba(16,24,40,.04),0 2px 10px rgba(16,24,40,.05);
  --blue-bg:#E3EDFF; --blue-fg:#1D4ED8; --green-bg:#DDF4E6; --green-fg:#15803D;
  --purple-bg:#EDE6FF; --purple-fg:#6D28D9; --orange-bg:#FFE8D9; --orange-fg:#C2410C;
  --pink-bg:#FFE0E8; --pink-fg:#BE185D; --teal-bg:#D8F3F0; --teal-fg:#0F766E;
  --amber-bg:#FFF0C8; --amber-fg:#92400E; --slate-bg:#E9EEF5; --slate-fg:#334155;
  --fs:1;
  --glass:rgba(255,255,255,.55); --glass-strong:rgba(255,255,255,.74); --glass-modal:rgba(255,255,255,.86); --glass-line:rgba(255,255,255,.8);
  --glass-shadow:0 10px 30px rgba(23,59,112,.16),inset 0 1px 0 rgba(255,255,255,.9);
  --glass-soft:0 0 0 1px rgba(23,59,112,.07),0 2px 12px rgba(23,59,112,.07),inset 0 1px 0 rgba(255,255,255,.9);
  --glow1:rgba(37,99,235,.20); --glow2:rgba(139,92,246,.16); --glow3:rgba(20,184,166,.16);
  --spec:rgba(255,255,255,.95); --spec-dim:rgba(255,255,255,.32);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --btn:#2F5FB3; --accent:#7DA8FF; --focus:#9DBBFF; --bg:#0B1220; --card:#111A2E; --soft:#16223A; --fg:#E5E9F2; --muted:#9AA7BD;
  --line:#22304A; --line-strong:#33466A; --brand-text:#A9C3F7;
  --ok:#4ADE80; --ok-bg:#12301F; --warn:#FBBF24; --warn-bg:#3A2D10; --warn-fg:#F5C45C; --err:#F87171; --err-bg:#3B1A1A; --shadow:none;
  --blue-bg:#172A4D; --blue-fg:#9DBBFF; --green-bg:#12301F; --green-fg:#7DDBA3; --purple-bg:#2A2050; --purple-fg:#BBA6FF;
  --orange-bg:#3A2415; --orange-fg:#FFB27A; --pink-bg:#3A1A28; --pink-fg:#FF9EBB; --teal-bg:#10302E; --teal-fg:#6FD9CF;
  --amber-bg:#3A2D10; --amber-fg:#F5C45C; --slate-bg:#1B2536; --slate-fg:#A9B6CC;
  --glass:rgba(22,34,58,.55); --glass-strong:rgba(22,34,58,.72); --glass-modal:rgba(17,26,46,.86); --glass-line:rgba(255,255,255,.14);
  --glass-shadow:0 10px 30px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.12);
  --glass-soft:0 0 0 1px rgba(255,255,255,.08),0 2px 12px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.08);
  --glow1:rgba(59,110,230,.34); --glow2:rgba(139,92,246,.24); --glow3:rgba(20,184,166,.2); --spec:rgba(255,255,255,.5); --spec-dim:rgba(255,255,255,.09); color-scheme:dark}}
:root[data-theme="dark"]{
  --btn:#2F5FB3; --accent:#7DA8FF; --focus:#9DBBFF; --bg:#0B1220; --card:#111A2E; --soft:#16223A; --fg:#E5E9F2; --muted:#9AA7BD;
  --line:#22304A; --line-strong:#33466A; --brand-text:#A9C3F7;
  --ok:#4ADE80; --ok-bg:#12301F; --warn:#FBBF24; --warn-bg:#3A2D10; --warn-fg:#F5C45C; --err:#F87171; --err-bg:#3B1A1A; --shadow:none;
  --blue-bg:#172A4D; --blue-fg:#9DBBFF; --green-bg:#12301F; --green-fg:#7DDBA3; --purple-bg:#2A2050; --purple-fg:#BBA6FF;
  --orange-bg:#3A2415; --orange-fg:#FFB27A; --pink-bg:#3A1A28; --pink-fg:#FF9EBB; --teal-bg:#10302E; --teal-fg:#6FD9CF;
  --amber-bg:#3A2D10; --amber-fg:#F5C45C; --slate-bg:#1B2536; --slate-fg:#A9B6CC;
  --glass:rgba(22,34,58,.55); --glass-strong:rgba(22,34,58,.72); --glass-modal:rgba(17,26,46,.86); --glass-line:rgba(255,255,255,.14);
  --glass-shadow:0 10px 30px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.12);
  --glass-soft:0 0 0 1px rgba(255,255,255,.08),0 2px 12px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.08);
  --glow1:rgba(59,110,230,.34); --glow2:rgba(139,92,246,.24); --glow3:rgba(20,184,166,.2); --spec:rgba(255,255,255,.5); --spec-dim:rgba(255,255,255,.09); color-scheme:dark}

*{box-sizing:border-box}
html{height:100%;font-size:calc(16px * var(--fs));-webkit-text-size-adjust:100%}
body{min-height:100%;font-family:var(--font,Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif);font-size:1rem;line-height:1.5;background:var(--bg);color:var(--fg);-webkit-font-smoothing:antialiased}
h1,h2,h3,p{margin:0}
h1,h2,h3{text-wrap:balance;letter-spacing:-.01em}
button,input,select,textarea{font-family:inherit;font-size:1rem;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:8px}
h1:focus{outline:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ic{flex:none;display:block}
.num{font-variant-numeric:tabular-nums}

/* tons */
.t-blue{--tb:var(--blue-bg);--tf:var(--blue-fg)}.t-green{--tb:var(--green-bg);--tf:var(--green-fg)}
.t-purple{--tb:var(--purple-bg);--tf:var(--purple-fg)}.t-orange{--tb:var(--orange-bg);--tf:var(--orange-fg)}
.t-pink{--tb:var(--pink-bg);--tf:var(--pink-fg)}.t-teal{--tb:var(--teal-bg);--tf:var(--teal-fg)}
.t-amber{--tb:var(--amber-bg);--tf:var(--amber-fg)}.t-slate{--tb:var(--slate-bg);--tf:var(--slate-fg)}
.t-red{--tb:var(--err-bg);--tf:var(--err)}

/* structure */
.shell{display:flex;min-height:100%}
.main{flex:1;min-width:0;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));padding-block:14px 104px}
.view{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.view>*{animation:rise .28s ease both}
.view>*:nth-child(2){animation-delay:.03s}.view>*:nth-child(3){animation-delay:.06s}.view>*:nth-child(4){animation-delay:.09s}.view>*:nth-child(n+5){animation-delay:.12s}
@keyframes rise{from{opacity:.35;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes sh{to{background-position:-200% 0}}
@keyframes spin{to{transform:rotate(360deg)}}
html[data-motion="reduce"] *,html[data-motion="reduce"] *::before{animation:none!important;transition:none!important}
@media (prefers-reduced-motion:reduce){*,*::before{animation:none!important;transition:none!important}}

.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;gap:2px;background:var(--card);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.tab{flex:1;min-width:0;min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:0;background:none;color:var(--muted);font-size:.6875rem;font-weight:500;line-height:1.2;border-radius:12px;cursor:pointer}
.tab .w{display:grid;place-items:center;width:48px;height:28px;border-radius:14px;transition:background .18s}
.tab[aria-current="page"]{color:var(--accent);font-weight:700}
.tab[aria-current="page"] .w{background:var(--blue-bg)}
.side{display:none}
@media (min-width:900px){
  .tabbar{display:none}
  .main{padding-block:28px 56px}
  .side{display:flex;flex-direction:column;gap:4px;width:256px;flex:none;position:sticky;top:0;align-self:flex-start;height:100vh;padding:24px 14px;border-right:1px solid var(--line);background:var(--card)}
  .side .brand{display:flex;align-items:center;gap:10px;padding:4px 10px 18px;font-weight:700;color:var(--brand-text);line-height:1.15}
  .side .tab{flex:none;flex-direction:row;justify-content:flex-start;gap:12px;min-height:44px;padding:0 12px;font-size:.9375rem;border-radius:12px}
  .side .tab .w{width:28px;background:none!important}
  .side .tab[aria-current="page"]{background:var(--blue-bg)}
  .side hr{border:0;border-top:1px solid var(--line);margin:10px 4px;width:100%}
}
.shell.bare .tabbar,.shell.bare .side{display:none}
.shell.bare .main{padding-block:0;padding-inline:0;display:flex;flex-direction:column}
.shell.bare .view{flex:1;width:100%;max-width:none}
.setup{flex:1;width:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:18px;padding-block:max(24px,env(safe-area-inset-top,0px)) max(28px,env(safe-area-inset-bottom,0px));padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px))}
.pv{position:relative;overflow:hidden;border-radius:18px;padding:18px;background:radial-gradient(120px 90px at 15% 20%,var(--glow1),transparent 70%),radial-gradient(140px 100px at 90% 90%,var(--glow2),transparent 70%),linear-gradient(135deg,var(--blue-bg),var(--purple-bg));display:flex;justify-content:center}
.pvcap{display:flex;gap:6px;align-items:center;padding:8px 10px;border-radius:30px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow)}
.pvcap span{display:grid;place-items:center;width:44px;height:36px;border-radius:18px;color:var(--muted)}
.pvcap span.on{background:var(--blue-bg);color:var(--accent)}
html.glass .pvcap{background:var(--glass);border-color:var(--glass-line);-webkit-backdrop-filter:blur(18px) saturate(190%);backdrop-filter:blur(18px) saturate(190%);box-shadow:var(--glass-shadow)}
html.glass .pvcap span.on{background:var(--glass-strong);box-shadow:inset 0 0 0 1px var(--glass-line)}
.sample{padding:12px 14px;border-radius:14px;background:var(--soft)}
.tab>span:last-child{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row.docrow{flex-wrap:wrap;cursor:default}
.row.docrow .txt{flex:1 1 170px}
.row.docrow .dact{display:flex;gap:8px;align-items:center;margin-left:auto}

/* boutons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:14px;border:1.5px solid transparent;font-weight:600;cursor:pointer;text-decoration:none;transition:transform .12s,background .15s;text-align:center}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--btn);color:#fff}
.btn-primary:hover{filter:brightness(1.08)}
.btn-secondary{background:var(--card);border-color:var(--line-strong);color:var(--fg)}
.btn-ghost{background:none;color:var(--accent);padding:0 12px}
.btn-danger{background:var(--err);color:#fff}
.btn-sm{min-height:40px;padding:0 14px;font-size:.875rem;border-radius:12px}
.btn-block{width:100%}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.iconbtn{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;border:1px solid var(--line);background:var(--card);color:var(--fg);cursor:pointer;position:relative;flex:none}
.iconbtn .dot{position:absolute;top:-4px;right:-4px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:var(--err);color:#fff;font-size:.6875rem;font-weight:700;display:grid;place-items:center}

/* typo */
.h1{font-size:1.75rem;font-weight:800;line-height:1.15}
.h2{font-size:1.1875rem;font-weight:700;line-height:1.25}
.h3{font-size:1rem;font-weight:600;line-height:1.3}
.sub{color:var(--muted);font-size:.9375rem}
.small{font-size:.8125rem;color:var(--muted)}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px}

/* cartes et lignes */
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.pad{padding:16px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:14px;padding:14px 16px;width:100%;min-width:0;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);color:inherit;text-decoration:none;cursor:pointer;transition:transform .12s,border-color .15s}
a.row:hover,button.row:hover{border-color:var(--line-strong)}
.row:active{transform:scale(.99)}
.row .txt{flex:1;min-width:0}
.row .txt b{display:block;font-weight:600}
.row .txt span{display:block;color:var(--muted);font-size:.875rem;line-height:1.4}
.row .chev{color:var(--muted)}
.sq{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:var(--tb);color:var(--tf);flex:none}
.sq.sm{width:40px;height:40px;border-radius:12px}
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;font-size:.75rem;font-weight:700;letter-spacing:.02em;background:var(--tb,var(--soft));color:var(--tf,var(--muted));white-space:nowrap}
.badge.ok{background:var(--ok-bg);color:var(--ok)}.badge.warn{background:var(--warn-bg);color:var(--warn-fg)}.badge.err{background:var(--err-bg);color:var(--err)}
.badge.line{background:none;border:1px solid var(--line-strong);color:var(--muted)}
.notice{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:14px;background:var(--warn-bg);color:var(--warn-fg);font-size:.875rem;line-height:1.45}
.notice.info{background:var(--blue-bg);color:var(--blue-fg)}
.notice.ok{background:var(--ok-bg);color:var(--ok)}.notice.err{background:var(--err-bg);color:var(--err)}
.notice b{font-weight:700}

/* en-tête */
.top{display:flex;align-items:center;gap:12px}
.top .grow{flex:1;min-width:0}
.pagehead{display:flex;flex-direction:column;gap:6px}
.back{display:inline-flex;align-items:center;gap:6px;min-height:44px;margin-left:-8px;padding:0 10px;border:0;background:none;color:var(--accent);font-weight:600;border-radius:12px;cursor:pointer;align-self:flex-start}
.hello{display:flex;align-items:center;gap:12px}
.hello .logo{flex:none}
.avatar{width:44px;height:44px;border-radius:50%;background:var(--btn);color:#fff;display:grid;place-items:center;font-weight:700;border:0;cursor:pointer;flex:none}

/* recherche */
.searchbtn{display:flex;align-items:center;gap:10px;width:100%;min-height:52px;padding:0 16px;border-radius:16px;border:1px solid var(--line);background:var(--soft);color:var(--muted);text-align:left;cursor:pointer}
.field{display:flex;flex-direction:column;gap:6px}
.field label,.lbl{font-weight:600;font-size:.9375rem}
.input,.select,.textarea{width:100%;min-height:48px;padding:12px 14px;border-radius:14px;border:1.5px solid var(--line-strong);background:var(--card)}
.textarea{min-height:140px;resize:vertical;line-height:1.5}
.input:focus,.select:focus,.textarea:focus{outline:3px solid var(--focus);outline-offset:1px;border-color:var(--accent)}
.input[aria-invalid="true"],.textarea[aria-invalid="true"],.select[aria-invalid="true"]{border-color:var(--err)}
.err-msg{color:var(--err);font-size:.875rem;font-weight:500;display:flex;gap:6px;align-items:center}
.searchfield{position:relative}
.searchfield .ic{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.searchfield .input{padding-left:44px;background:var(--soft);border-color:var(--line)}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}

/* grilles */
.cats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.cat{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:102px;padding:12px 6px;border:0;border-radius:18px;background:var(--tb);color:var(--tf);font-weight:600;font-size:.8125rem;line-height:1.25;text-align:center;cursor:pointer;transition:transform .12s}
.cat:active{transform:scale(.97)}
.cat span{color:var(--fg)}
@media (min-width:560px){.cats{gap:14px}.cat{min-height:116px;font-size:.9375rem}}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:thin}
.chip{flex:none;min-height:40px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line-strong);background:var(--card);font-weight:600;font-size:.875rem;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--btn);border-color:var(--btn);color:#fff}
.snap{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:2px 2px 8px;margin-inline:-2px}
.snap>*{scroll-snap-align:start;flex:0 0 min(86%,340px)}

/* actualités */
.news{display:flex;flex-direction:column;gap:0;padding:0;overflow:hidden;color:inherit;text-decoration:none;cursor:pointer;transition:transform .12s;min-width:0}
.news:active{transform:scale(.99)}
.cover{height:104px;background:var(--tb);color:var(--tf);position:relative;display:grid;place-items:center;overflow:hidden}
.cover::before,.cover::after{content:"";position:absolute;border-radius:50%;background:var(--tf);opacity:.12}
.cover::before{width:150px;height:150px;left:-30px;top:-60px}.cover::after{width:110px;height:110px;right:-20px;bottom:-50px}
.news .body{padding:16px;display:flex;flex-direction:column;gap:8px}
.news .meta{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;color:var(--muted);font-size:.8125rem}
.news h3{font-size:1.0625rem}
.news p{color:var(--muted);font-size:.9375rem}
.more{display:inline-flex;align-items:center;gap:6px;color:var(--accent);font-weight:600;font-size:.9375rem}
.article-body{display:flex;flex-direction:column;gap:14px;font-size:1.0625rem;line-height:1.7;max-width:65ch}
.article-body h2{font-size:1.25rem;margin-top:8px}
.article-body ul{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px}

/* annonces */
.ann{display:flex;gap:12px;padding:14px 16px;align-items:flex-start}
.ann .lv{flex:none;width:36px;height:36px;border-radius:12px;display:grid;place-items:center}
.ann.urgent .lv{background:var(--err-bg);color:var(--err)}.ann.important .lv{background:var(--warn-bg);color:var(--warn-fg)}.ann.info .lv{background:var(--blue-bg);color:var(--blue-fg)}

/* listes de données */
.kv{margin:0;display:flex;flex-direction:column}
.kv>div{display:flex;justify-content:space-between;gap:16px;padding:10px 0;border-bottom:1px solid var(--line)}
.kv>div:last-child{border-bottom:0}
.kv dt{color:var(--muted)}.kv dd{margin:0;font-weight:600;text-align:right}
.steps{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:12px;counter-reset:s}
.steps li{counter-increment:s;display:flex;gap:12px;align-items:flex-start}
.steps li::before{content:counter(s);flex:none;width:28px;height:28px;border-radius:50%;background:var(--blue-bg);color:var(--blue-fg);font-weight:700;font-size:.875rem;display:grid;place-items:center}
.ul{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px}
.date{flex:none;width:56px;height:60px;border-radius:14px;background:var(--tb);color:var(--tf);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
.date b{font-size:1.375rem;font-weight:800}.date span{font-size:.6875rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.month{font-size:.8125rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-top:4px}

/* interrupteurs et segments */
.switch{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:52px;padding:8px 0;cursor:pointer}
.switch input{position:absolute;opacity:0;width:1px;height:1px}
.switch .track{flex:none;width:52px;height:32px;border-radius:16px;background:var(--line-strong);position:relative;transition:background .18s}
.switch .track::after{content:"";position:absolute;left:3px;top:3px;width:26px;height:26px;border-radius:50%;background:#fff;transition:transform .18s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.switch input:checked+.track{background:var(--btn)}
.switch input:checked+.track::after{transform:translateX(20px)}
.switch input:focus-visible+.track{outline:3px solid var(--focus);outline-offset:2px}
.seg{display:flex;gap:4px;padding:4px;border-radius:14px;background:var(--soft)}
.seg button{flex:1;min-height:40px;border:0;border-radius:10px;background:none;font-weight:600;font-size:.875rem;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--fg);box-shadow:var(--shadow)}

/* accordéon */
.acc{overflow:hidden}
.acc>button{width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:56px;padding:12px 16px;border:0;background:none;text-align:left;font-weight:600;cursor:pointer}
.acc>button .ic{transition:transform .2s;color:var(--muted)}
.acc>button[aria-expanded="true"] .ic{transform:rotate(90deg)}
.acc .ans{padding:0 16px 16px;color:var(--muted)}

/* états */
.state{display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px;padding:36px 20px}
.state .big{width:72px;height:72px;border-radius:24px;display:grid;place-items:center;background:var(--tb);color:var(--tf)}
.state p{color:var(--muted);max-width:42ch}
.state .acts{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:6px}
.sk{background:linear-gradient(90deg,var(--soft),var(--line),var(--soft));background-size:200% 100%;animation:sh 1.3s linear infinite;border-radius:10px}
.spin{width:18px;height:18px;border-radius:50%;border:2.5px solid currentColor;border-right-color:transparent;animation:spin .7s linear infinite}

/* accueil écran bienvenue */
.welcome{flex:1;width:100%;max-width:460px;margin:0 auto;display:flex;flex-direction:column;padding-block:max(28px,env(safe-area-inset-top,0px)) max(28px,env(safe-area-inset-bottom,0px));padding-inline:max(24px,env(safe-area-inset-left,0px)) max(24px,env(safe-area-inset-right,0px))}
.welcome .hero{text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;padding-top:6vh}
.welcome .word{font-size:2.5rem;line-height:1.05;letter-spacing:-.02em;color:var(--fg)}
.welcome .word .l{font-weight:300;display:block;font-size:2.25rem}
.welcome .word .b{font-weight:800;display:block;font-size:2.75rem}
.welcome .rule{width:44px;height:3px;border-radius:2px;background:var(--line-strong);margin:14px auto 10px}
.welcome .slogan{color:var(--muted);font-size:1.1875rem;max-width:18ch}
.welcome .waves{flex:1;min-height:150px;position:relative;margin-inline:calc(-1 * max(24px,env(safe-area-inset-left,0px))) calc(-1 * max(24px,env(safe-area-inset-right,0px)))}
.welcome .waves svg{position:absolute;inset:0;width:100%;height:100%}
.welcome .cta{display:flex;flex-direction:column;gap:12px;position:relative}
.welcome .foot{text-align:center;margin-top:10px}

/* modale, toast */
.scrim{position:fixed;inset:0;z-index:50;background:rgba(15,23,42,.5);display:flex;align-items:flex-end;justify-content:center;padding:max(0px,env(safe-area-inset-top,0px)) env(safe-area-inset-right,0px) 0 env(safe-area-inset-left,0px);animation:fade .18s ease both}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{background:var(--card);width:100%;max-width:520px;max-height:90%;overflow:auto;border-radius:24px 24px 0 0;padding:22px 20px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;animation:rise .25s ease both}
@media (min-width:600px){.scrim{align-items:center}.modal{border-radius:24px;padding-bottom:22px}}
.mact{display:flex;flex-wrap:wrap;gap:10px;justify-content:flex-end}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(88px + env(safe-area-inset-bottom,0px));z-index:60;max-width:min(92vw,440px);background:#0F172A;color:#fff;padding:12px 18px;border-radius:14px;font-size:.9375rem;box-shadow:0 8px 24px rgba(0,0,0,.25);animation:rise .22s ease both}
@media (min-width:900px){.toast{bottom:32px}}
.net{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--warn-bg);color:var(--warn-fg);padding:8px 16px;text-align:center;font-size:.875rem;font-weight:600}

/* tableaux */
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.9375rem}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.swatches{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.sw{border:1px solid var(--line);border-radius:12px;overflow:hidden;font-size:.8125rem}
.sw i{display:block;height:44px}.sw div{padding:8px 10px}
.icons{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px}
.icons div{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:.6875rem;color:var(--muted);padding:8px 2px;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.divider{border:0;border-top:1px solid var(--line);margin:0}

/* Liquid Glass : actif par défaut sur iOS, réglable dans Paramètres.
   Le flou n'est posé que sur la navigation et les couches flottantes ; les cartes restent translucides sans flou, pour garder de la fluidité. */
html.glass .shell{position:relative;isolation:isolate}
html.glass .shell::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(60vmax 48vmax at 6% -4%,var(--glow1),transparent 62%),radial-gradient(50vmax 44vmax at 108% 28%,var(--glow2),transparent 62%),radial-gradient(56vmax 46vmax at 18% 112%,var(--glow3),transparent 62%)}
html.glass .main{padding-block:14px 124px}
html.glass .tabbar{left:max(14px,env(safe-area-inset-left,0px));right:max(14px,env(safe-area-inset-right,0px));bottom:calc(10px + env(safe-area-inset-bottom,0px));padding:6px;border:1px solid var(--glass-line);border-radius:34px;background:var(--glass);-webkit-backdrop-filter:blur(26px) saturate(190%);backdrop-filter:blur(26px) saturate(190%);box-shadow:var(--glass-shadow)}
html.glass .tab[aria-current="page"] .w{background:var(--glass-strong);box-shadow:inset 0 0 0 1px var(--glass-line),0 2px 10px rgba(23,59,112,.14)}
html.glass .card,html.glass .row{background:var(--glass-strong);border-color:transparent;border-radius:22px;box-shadow:var(--glass-soft)}
html.glass .news{border-radius:24px}
html.glass .cat{border-radius:22px;box-shadow:inset 0 1px 0 rgba(255,255,255,.5)}
html.glass .searchbtn,html.glass .iconbtn,html.glass .back,html.glass .seg{background:var(--glass);border:1px solid var(--glass-line);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);box-shadow:var(--glass-soft)}
html.glass .searchbtn{border-radius:999px}
html.glass .back{margin-left:0;padding:0 16px 0 10px;border-radius:999px}
html.glass .chip{background:var(--glass-strong);border-color:var(--glass-line);box-shadow:var(--glass-soft)}
html.glass .chip[aria-pressed="true"]{background:var(--btn);border-color:var(--btn)}
html.glass .btn{border-radius:999px}
html.glass .btn-primary{background:linear-gradient(180deg,rgba(255,255,255,.24),rgba(255,255,255,0) 55%),var(--btn);box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 8px 20px rgba(23,59,112,.28)}
html.glass .btn-secondary{background:var(--glass-strong);border-color:var(--glass-line);box-shadow:var(--glass-soft)}
html.glass .input,html.glass .select,html.glass .textarea{background:var(--glass-strong);border-radius:16px}
html.glass .seg button[aria-pressed="true"]{background:var(--glass-strong);box-shadow:inset 0 0 0 1px var(--glass-line),var(--glass-soft)}
html.glass .scrim{background:rgba(15,23,42,.28);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
html.glass .modal{background:var(--glass-modal);-webkit-backdrop-filter:blur(34px) saturate(190%);backdrop-filter:blur(34px) saturate(190%);border:1px solid var(--glass-line);border-radius:30px 30px 0 0;box-shadow:var(--glass-shadow)}
html.glass .toast{bottom:calc(96px + env(safe-area-inset-bottom,0px));background:rgba(15,23,42,.72);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);border:1px solid rgba(255,255,255,.16);border-radius:999px}
html.glass .net{background:var(--glass);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%)}
@media (min-width:600px){html.glass .modal{border-radius:30px}}
@media (min-width:900px){
  html.glass .main{padding-block:28px 56px}
  html.glass .toast{bottom:32px}
  html.glass .side{background:var(--glass);-webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);border-right-color:var(--glass-line)}
}
@media (prefers-reduced-transparency:reduce){
  html.glass{--glass:var(--card);--glass-strong:var(--card);--glass-modal:var(--card);--glass-line:var(--line)}
  html.glass *{-webkit-backdrop-filter:none!important;backdrop-filter:none!important}
}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
  html.glass{--glass:var(--card);--glass-strong:var(--card);--glass-modal:var(--card)}
}

/* Liquid Glass v2 : reflets de bord, bulle d'onglet animée, réfraction réelle sur Chromium (Safari iOS : rendu approché) */
html.glass{-webkit-tap-highlight-color:transparent}
html.glass .tabbar,html.glass .iconbtn,html.glass .back,html.glass .searchbtn,html.glass .modal,html.glass .toast{border:0}
html.glass .back,html.glass .searchbtn{position:relative}
html.glass .tabbar{background:linear-gradient(180deg,var(--spec-dim),transparent 60%),var(--glass);-webkit-backdrop-filter:blur(10px) saturate(190%) brightness(1.06);backdrop-filter:var(--lg-bf-bar,blur(10px) saturate(190%) brightness(1.06));box-shadow:0 12px 36px rgba(23,59,112,.20),0 2px 6px rgba(23,59,112,.10),inset 0 1px 0 var(--spec),inset 0 -1px 0 var(--spec-dim),inset 0 0 22px var(--spec-dim);touch-action:pan-y;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html.glass .tabbar::after,html.glass .iconbtn::after,html.glass .back::after,html.glass .searchbtn::after,html.glass .toast::after,html.glass .bubble::after{content:"";position:absolute;inset:0;border-radius:inherit;padding:1.25px;pointer-events:none;background:linear-gradient(135deg,var(--spec) 0%,var(--spec-dim) 28%,transparent 48%,transparent 56%,var(--spec-dim) 74%,var(--spec) 100%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
html.glass .iconbtn,html.glass .back,html.glass .searchbtn{background:linear-gradient(180deg,var(--spec-dim),transparent 60%),var(--glass);box-shadow:0 6px 18px rgba(23,59,112,.12),inset 0 1px 0 var(--spec),inset 0 0 12px var(--spec-dim);transition:transform .4s cubic-bezier(.34,1.5,.5,1)}
html.glass .iconbtn:active,html.glass .back:active,html.glass .searchbtn:active{transform:scale(.94)}
html.glass .toast{box-shadow:0 10px 30px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.25)}
html.glass .modal{-webkit-backdrop-filter:blur(18px) saturate(190%) brightness(1.05);backdrop-filter:var(--lg-bf-mod,blur(18px) saturate(190%) brightness(1.05));box-shadow:0 24px 60px rgba(15,23,42,.3),inset 0 1px 0 var(--spec),inset 0 0 26px var(--spec-dim);animation:pop .45s cubic-bezier(.34,1.4,.5,1) both}
@keyframes pop{from{opacity:0;transform:translateY(26px) scale(.96)}to{opacity:1;transform:none}}
.bubble{display:none}
html.glass .tab{position:relative;z-index:1}
html.glass .tab[aria-current="page"] .w{background:none;box-shadow:none}
html.glass .bubble{display:block;position:absolute;left:0;top:6px;bottom:6px;width:0;border-radius:30px;z-index:0;pointer-events:none;transform:translateX(var(--bx,0px)) scale(var(--bs,1));transition:transform .5s cubic-bezier(.34,1.45,.5,1),width .5s cubic-bezier(.34,1.45,.5,1),opacity .2s,background .25s,box-shadow .25s;background:linear-gradient(180deg,var(--spec),var(--spec-dim) 45%,transparent),var(--glass-strong);-webkit-backdrop-filter:blur(6px) saturate(200%) brightness(1.1);backdrop-filter:var(--lg-bf-bub,blur(6px) saturate(200%) brightness(1.1));box-shadow:0 4px 14px rgba(23,59,112,.18),inset 0 1px 0 var(--spec),inset 0 -2px 6px var(--spec-dim)}
html.glass .bubble.nt{transition:none}
html.glass .bubble.stretch{animation:stretch .5s ease}
@keyframes stretch{35%{scale:1.16 .88}70%{scale:.97 1.04}100%{scale:1 1}}
html.glass .tabbar.press .bubble{--bs:1.16;background:linear-gradient(180deg,var(--spec-dim),transparent 60%),rgba(255,255,255,.14);box-shadow:0 10px 26px rgba(23,59,112,.26),inset 0 1px 0 var(--spec),inset 0 0 14px var(--spec-dim)}
html.glass .tabbar.drag .bubble{transition:width .5s,transform .09s linear}
@media (prefers-reduced-motion:reduce){html.glass .bubble,html.glass .modal{animation:none!important;transition:none!important}}


/* =========================================================
   CAMPUS ROSA PARKS — REFONTE UI V3
   Inspirée des maquettes fournies, sans modifier la logique
   ni le DOM interne de la section « À la une » existante.
   ========================================================= */
:root{
  --brand:#142f5d;--btn:#14366b;--accent:#1459c7;--focus:#2563eb;
  --bg:#f7f9fd;--card:#ffffff;--soft:#f2f5fa;--fg:#13203d;--muted:#72809a;
  --line:#edf0f6;--line-strong:#dce3ee;--brand-text:#16376b;
  --blue-bg:#eaf2ff;--blue-fg:#2162d8;--green-bg:#e5f6ee;--green-fg:#15946a;
  --purple-bg:#f0eafe;--purple-fg:#7845d9;--orange-bg:#fff0e8;--orange-fg:#f05c37;
  --pink-bg:#ffebf1;--pink-fg:#e84376;--teal-bg:#e4f6f3;--teal-fg:#0f887f;
  --amber-bg:#fff3dd;--amber-fg:#ac6c05;--slate-bg:#eff2f8;--slate-fg:#56667e;
  --shadow:0 3px 18px rgba(17,40,85,.042);--fs:1;
}
html{scroll-behavior:smooth}
body{letter-spacing:-.011em;background:var(--bg)}
.shell{min-height:100vh}
.main{padding:26px 20px 110px}
.view{max-width:760px;gap:23px}
.h1{font-size:clamp(1.55rem,2.5vw,2rem);font-weight:800;letter-spacing:-.045em;color:var(--fg)}
.h2{font-size:1.18rem;font-weight:800;letter-spacing:-.035em}
.h3{font-size:1rem;font-weight:700;letter-spacing:-.018em}
.sub{color:var(--muted);line-height:1.5}
.small{color:var(--muted)}
.card{border-radius:17px;border:1px solid var(--line);box-shadow:var(--shadow)}
.row{border-radius:16px;box-shadow:var(--shadow);gap:13px;min-height:72px}
.row:hover{background:color-mix(in srgb,var(--card) 97%,var(--blue-bg));border-color:#cbd9f3;transform:translateY(-1px)}
.row .txt b{color:var(--fg);font-size:.94rem}
.row .txt span{font-size:.8rem;margin-top:3px}
.sq{width:48px;height:48px;border-radius:13px}
.sq.sm{width:42px;height:42px;border-radius:12px}
.btn{border-radius:14px;min-height:45px;font-size:.91rem;box-shadow:none}
.btn-primary{background:linear-gradient(135deg,#204c86,#10305f);color:#fff;box-shadow:0 3px 9px rgba(20,50,102,.10)}
.btn-primary:hover{filter:brightness(1.12)}
.btn-secondary{border-color:#cbd5e5;background:white;color:#18335d}
.btn-ghost{color:var(--accent)}
.iconbtn{border-radius:14px}
.input,.select,.textarea{border-radius:13px;background:white}
.searchbtn{border:0;background:#f0f3f8;border-radius:14px;min-height:46px}
.searchfield .input{background:#f2f5fa;border:1px solid transparent;min-height:46px;border-radius:14px}
.pagehead{gap:5px}
.back{min-height:36px;color:#435774;font-size:.83rem;margin-bottom:5px}
.chip{min-height:35px;font-weight:600;font-size:.8rem;border:none;background:#f1f4f9;padding:0 15px}
.chip[aria-pressed="true"]{background:var(--brand);color:#fff}
.notice{border-radius:13px;font-size:.84rem}
.demo-inline{font-size:.73rem;color:var(--muted);display:flex;align-items:center;gap:6px}
.section-lead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.section-lead h2{font-size:1.18rem;line-height:1.25;letter-spacing:-.025em}
.section-lead p{font-size:.84rem;color:var(--muted);margin-top:5px}
.top-left{display:flex;gap:12px;align-items:center;min-width:0}
.quick-cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:11px}
.quick-tile{background:var(--tb);min-width:0;border:none;border-radius:16px;padding:17px 11px;display:flex;flex-direction:column;gap:11px;align-items:flex-start;text-align:left;color:var(--tf);cursor:pointer;transition:transform .18s,box-shadow .18s;min-height:112px}
.quick-tile:hover,.feature-tile:hover,.link-card:hover,.campus-card:hover{transform:translateY(-2px);box-shadow:0 12px 25px rgba(23,59,112,.10)}

.login-box{background:white;border:1px solid #edf0f7;box-shadow:0 20px 60px rgba(18,48,88,.07);border-radius:22px;padding:28px;display:flex;flex-direction:column;gap:16px}

.login-box .actions{display:flex;flex-direction:column;gap:10px}
.login-box .muted-link{font-size:.8rem;border:0;background:none;color:#ed604b;cursor:pointer;font-weight:700}
.login-box .demo-access{padding:12px;background:#f5f8fd;border:1px solid #e5edfa;border-radius:14px}
.login-box .demo-access p{font-size:.78rem;color:#60718e}
.login-box .demo-roles{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}
.login-box .demo-roles .btn{min-height:32px;font-size:.73rem;padding:5px 11px}
.login-box label{font-weight:600;font-size:.84rem}
.login-box .input{min-height:47px}
.login-box .login-check{display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:.78rem}

  return lgSvg;

/* Carte de déplacement : au bord, le fond est tiré depuis l'intérieur de la forme ; au centre, aucune déformation. */
function refractMap(w,h,r,bezel){
  var c=document.createElement('canvas');c.width=w;c.height=h;
  var g=c.getContext('2d'),img=g.createImageData(w,h),d=img.data;
  for(var j=0;j<h;j++){for(var i=0;i<w;i++){
    var px=i+.5,py=j+.5,qx=Math.abs(px-w/2)-(w/2-r),qy=Math.abs(py-h/2)-(h/2-r);
    var dist=-(Math.hypot(Math.max(qx,0),Math.max(qy,0))+Math.min(Math.max(qx,qy),0)-r);
    var k=(i+j*w)*4,R=128,G=128;
    if(dist>=0&&dist<bezel){
      var sx=px<w/2?-1:1,sy=py<h/2?-1:1,nx,ny;
      if(qx>0&&qy>0){var l=Math.hypot(qx,qy)||1;nx=sx*qx/l;ny=sy*qy/l}else if(qx>qy){nx=sx;ny=0}else{nx=0;ny=sy}
      var t=1-dist/bezel,m=t*t*(3-2*t);
      R=Math.round(128-127*nx*m);G=Math.round(128-127*ny*m);
    }
    d[k]=R;d[k+1]=G;d[k+2]=128;d[k+3]=255;
  }}
  g.putImageData(img,0,0);
  return c.toDataURL('image/png');
}
function setRefraction(el,prop,id,w,h,r,bezel,scale){
  if(!el)return;
  w=Math.round(w);h=Math.round(h);
  if(w<8||h<8||!glassOn()||!IS_CHROMIUM){el.style.removeProperty(prop);el._lgKey=null;return}
  var key=w+'x'+h;
  if(el._lgKey===key&&el.style.getPropertyValue(prop))return;
  try{
    var host=lgHost(),old=host.querySelector('#'+id);if(old)old.remove();
    var url=refractMap(w,h,Math.min(r,h/2,w/2),bezel);
    var tmp=document.createElement('div');
    tmp.innerHTML='<svg xmlns="http://www.w3.org/2000/svg"><filter id="'+id+'" x="0" y="0" width="'+w+'" height="'+h+'" filterUnits="userSpaceOnUse" primitiveUnits="userSpaceOnUse" color-interpolation-filters="sRGB"><feImage href="'+url+'" x="0" y="0" width="'+w+'" height="'+h+'" preserveAspectRatio="none" result="map"/><feGaussianBlur in="SourceGraphic" stdDeviation="1.2" result="b"/><feDisplacementMap in="b" in2="map" scale="'+scale+'" xChannelSelector="R" yChannelSelector="G"/></filter></svg>';
    host.appendChild(tmp.querySelector('filter'));
    el.style.setProperty(prop,'url(#'+id+') blur(1px) saturate(190%) brightness(1.08)');
    el._lgKey=key;
  }catch(e){el.style.removeProperty(prop);el._lgKey=null}
}

  var first=!bub.dataset.init,moved=bub.dataset.x!==undefined&&Math.abs(parseFloat(bub.dataset.x)-x)>2;

(function(){
  var tb=$('#tabbar'),st=null,suppress=false,rz=null;
  tb.addEventListener('pointerdown',function(e){
    if(!glassOn())return;
    var bub=$('.bubble',tb);if(!bub||bub.style.opacity==='0')return;
    st={x:e.clientX,drag:false};tb.classList.add('press');
  });
  window.addEventListener('pointermove',function(e){
    if(!st)return;
    if(!st.drag&&Math.abs(e.clientX-st.x)>8){st.drag=true;tb.classList.add('drag')}
    if(st.drag){
      var bub=$('.bubble',tb),r=tb.getBoundingClientRect(),w=bub.offsetWidth;
      bub.style.setProperty('--bx',Math.max(6,Math.min(r.width-6-w,e.clientX-r.left-w/2))+'px');
    }
  });
  function end(e,cancel){
    if(!st)return;
    var s=st;st=null;tb.classList.remove('press','drag');
    if(s.drag){
      suppress=true;setTimeout(function(){suppress=false},350);
      if(!cancel){
        var best=null,bd=1e9;
        $$('.tab[data-tab]',tb).forEach(function(t){var c=t.getBoundingClientRect(),dd=Math.abs(c.left+c.width/2-e.clientX);if(dd<bd){bd=dd;best=t}});

    }
  }
  window.addEventListener('pointerup',function(e){end(e,false)});
  window.addEventListener('pointercancel',function(e){end(e,true)});
  tb.addEventListener('click',function(e){if(suppress){e.stopPropagation();e.preventDefault();suppress=false}},true);

function listNews(){
  var f=S.nf,all=publishedNews();
  var chips='<button class="chip" aria-pressed="'+(f.cat==='all')+'" data-act="ncat" data-id="all">Toutes</button>'+Object.keys(CATS).map(function(k){return '<button class="chip" aria-pressed="'+(f.cat===k)+'" data-act="ncat" data-id="'+k+'">'+CATS[k].name+'</button>'}).join('');
  var el=$('#ncats');if(!el)return;el.innerHTML=chips;
  var q=norm(f.q);
  var list=all.filter(function(n){return (f.cat==='all'||n.cat===f.cat)&&(!q||norm(n.title+' '+n.summary).indexOf(q)>-1)});
  list.sort(function(a,b){return f.sort==='desc'?(a.date<b.date?1:-1):(a.date>b.date?1:-1)});
  $('#nsort').innerHTML=ic('refresh',16)+' '+(f.sort==='desc'?'Plus récentes d’abord':'Plus anciennes d’abord');
  $('#ncount').textContent=list.length+' actualité'+(list.length>1?'s':'');
  var out='';
  if(!all.length)out=stateCard({icon:'news',title:'Aucune actualité publiée',text:'Les actualités publiées par l’établissement apparaîtront ici.'});
  else if(!list.length)out=stateCard({icon:'search',tone:'amber',title:'Aucun résultat',text:'Aucune actualité ne correspond à votre recherche. Essayez d’autres mots ou retirez le filtre.',acts:[{l:'Réinitialiser',act:'nreset',p:1}]});
  else{
    var showFeat=!q&&f.cat==='all';
    out=list.map(function(n,i){return newsCard(n,showFeat&&n.featured&&i<3)}).join('');
  }
  $('#nlist').innerHTML=out;
}

function searchIndex(){
  var out=[];
  S.news.filter(function(n){return n.status==='published'}).forEach(function(n){out.push({k:'Actualité',t:n.title,x:n.summary+' '+n.body.map(function(b){return b.t==='ul'?b.x.join(' '):b.x}).join(' '),go:'article:'+n.id,i:'news',tone:CATS[n.cat].tone})});
  DOCS.forEach(function(d){out.push({k:'Document',t:d.title,x:d.cat,go:'docs',i:'file',tone:'blue'})});
  FAQ.forEach(function(f){out.push({k:'FAQ',t:f.q,x:f.a,go:'faq',i:'help',tone:'orange'})});
  SERVICES.filter(function(s){return s.on}).forEach(function(s){out.push({k:'Service',t:s.title,x:s.desc,go:'service:'+s.id,i:s.icon,tone:s.tone})});
  Object.keys(PAGES).forEach(function(id){var p=PAGES[id];out.push({k:'Information',t:p.title,x:p.intro+' '+p.secs.map(function(s){return s.h+' '+(s.p||'')}).join(' '),go:'page:'+id,i:p.icon,tone:p.tone})});
  EVENTS.forEach(function(e){out.push({k:'Événement',t:e.title,x:e.desc+' '+e.loc,go:'events',i:'cal',tone:e.tone})});
  return out;
}

V.contact=function(p){
  var cats=['Demande de renseignements','Scolarité','Inscription','Problème matériel','Assistance technique','Autre'];
  var pre=p&&p.cat?p.cat:'';
  return {html:head('Contact','Écrivez à un service de l’établissement.')+
  noticeHtml('warn','alert','<b>Aucun serveur connecté.</b> Dans cette démonstration, le message n’est pas transmis. Il est seulement vérifié et préparé.')+
  '<form class="card pad stack" id="cf" novalidate>'+
   '<div class="field"><label for="c-sub">Sujet</label><input class="input" id="c-sub" maxlength="120" autocomplete="off" aria-describedby="e-sub"><div id="e-sub"></div></div>'+
   '<div class="field"><label for="c-cat">Catégorie</label><select class="select" id="c-cat" aria-describedby="e-cat"><option value="">Choisir une catégorie</option>'+cats.map(function(c){return '<option'+(c===pre?' selected':'')+'>'+c+'</option>'}).join('')+'</select><div id="e-cat"></div></div>'+
   '<div class="field"><label for="c-msg">Message</label><textarea class="textarea" id="c-msg" maxlength="2000" aria-describedby="e-msg c-cnt"></textarea><div style="display:flex;justify-content:space-between;gap:10px"><div id="e-msg"></div><span class="small num" id="c-cnt">0 / 2000</span></div></div>'+
   '<div class="field"><label for="c-file">Pièce jointe (facultative)</label><input class="input" id="c-file" type="file" accept=".pdf,.png,.jpg,.jpeg" aria-describedby="e-file"><span class="small">PDF, PNG ou JPG · 5 Mo maximum</span><div id="e-file"></div></div>'+
   '<div class="hp" aria-hidden="true"><label for="c-web">Ne pas remplir</label><input id="c-web" tabindex="-1" autocomplete="off"></div>'+
   '<button class="btn btn-primary" id="c-go" type="submit">Envoyer le message</button></form><div id="c-res"></div>',
  mount:function(){
    var f=$('#cf');
    $('#c-msg').addEventListener('input',function(e){$('#c-cnt').textContent=e.target.value.length+' / 2000'});
    function setErr(id,fld,msg){var h=$('#'+id);h.innerHTML=msg?'<p class="err-msg" role="alert">'+ic('alert',16)+esc(msg)+'</p>':'';$('#'+fld).setAttribute('aria-invalid',msg?'true':'false')}
    f.addEventListener('submit',function(e){
      e.preventDefault();
      var sub=$('#c-sub').value.trim(),cat=$('#c-cat').value,msg=$('#c-msg').value.trim(),file=$('#c-file').files[0];
      var bad=null;
      setErr('e-sub','c-sub',sub.length<3?'Indiquez un sujet d’au moins 3 caractères.':'');if(sub.length<3)bad=bad||'c-sub';
      setErr('e-cat','c-cat',!cat?'Choisissez une catégorie.':'');if(!cat)bad=bad||'c-cat';
      setErr('e-msg','c-msg',msg.length<10?'Décrivez votre demande en au moins 10 caractères.':'');if(msg.length<10)bad=bad||'c-msg';
      var fe='';if(file){if(file.size>5*1024*1024)fe='Ce fichier dépasse 5 Mo.';else if(!/\.(pdf|png|jpe?g)$/i.test(file.name))fe='Format non accepté. Utilisez PDF, PNG ou JPG.'}
      setErr('e-file','c-file',fe);if(fe)bad=bad||'c-file';
      if(bad){$('#'+bad).focus();return}
      if($('#c-web').value){return}
      if(Date.now()-S.lastSubmit<15000){$('#c-res').innerHTML=noticeHtml('warn','alert','Merci d’attendre quelques secondes avant un nouvel envoi.');return}
      S.lastSubmit=Date.now();
      var btn=$('#c-go');btn.disabled=true;btn.innerHTML='<span class="spin"></span> Vérification…';
      setTimeout(function(){
        btn.disabled=false;btn.textContent='Envoyer le message';
        $('#c-res').innerHTML='<div class="card pad stack">'+noticeHtml('warn','alert','<b>Message non envoyé.</b> Aucun service n’est connecté à cette démonstration. Votre message est valide et prêt à être transmis par un service sécurisé une fois celui-ci en place.')+'<dl class="kv"><div><dt>Sujet</dt><dd>'+esc(sub)+'</dd></div><div><dt>Catégorie</dt><dd>'+esc(cat)+'</dd></div>'+(file?'<div><dt>Pièce jointe</dt><dd>'+esc(file.name)+'</dd></div>':'')+'</dl><button class="btn btn-secondary btn-sm" data-act="copymsg" style="align-self:flex-start">Copier le message</button></div>';
        S.draft='Sujet : '+sub+'\nCatégorie : '+cat+'\n\n'+msg;
        $('#c-res').scrollIntoView({behavior:'smooth',block:'center'});
      },600);
    });
  }};
};

function denyDoc(){openModal({title:'Connexion requise',body:'<p>Ce document est réservé aux utilisateurs connectés.</p>',actions:[{label:'Plus tard',cls:'btn-secondary'},{label:'Se connecter',fn:function(){go('login')}}]})}

document.addEventListener('click',function(e){
  var t=e.target.closest('[data-tab],[data-go],[data-act]');if(!t)return;
  if(t.dataset.tab){e.preventDefault();tab(t.dataset.tab);return}
  if(t.dataset.go){e.preventDefault();goStr(t.dataset.go);return}
  if(t.dataset.act&&ACT[t.dataset.act]){e.preventDefault();ACT[t.dataset.act](t,e)}
});

/* ---------- réglages persistants (par navigateur) ---------- */
function applySettings(){
  var r=document.documentElement,st=S.settings;
  if(st.theme==='auto')r.removeAttribute('data-theme');else r.setAttribute('data-theme',st.theme);
  r.style.setProperty('--fs',st.size);
  if(st.reduce)r.setAttribute('data-motion','reduce');else r.removeAttribute('data-motion');
  r.classList.toggle('glass',!!st.glass);
  r.style.setProperty('--font',FONTMAP[st.font]||FONTMAP.inter);
  setTimeout(lgRefresh,0);
}
function saveSettings(){try{localStorage.setItem('crp-settings',JSON.stringify(S.settings))}catch(e){}}
try{var raw=localStorage.getItem('crp-settings');if(raw){var o=JSON.parse(raw);if(o&&typeof o==='object'){S.settings.theme=['auto','light','dark'].indexOf(o.theme)>-1?o.theme:'auto';S.settings.size=[1,1.125,1.25].indexOf(o.size)>-1?o.size:1;S.settings.reduce=!!o.reduce;if(typeof o.glass==='boolean')S.settings.glass=o.glass;if(FONTMAP[o.font])S.settings.font=o.font}}}catch(e){}

/* ---------- glisser pour rafraîchir (accueil) ---------- */
var pull={y:null,dy:0};
function initPull(){}
document.addEventListener('touchstart',function(e){pull.y=(S.route==='home'&&window.scrollY<=0&&!$('#scrim'))?e.touches[0].clientY:null;pull.dy=0},{passive:true});
document.addEventListener('touchmove',function(e){if(pull.y!==null)pull.dy=e.touches[0].clientY-pull.y},{passive:true});
document.addEventListener('touchend',function(){
  if(pull.y!==null&&pull.dy>90){S.homeReady=false;render();toast('Contenus actualisés (données de démonstration)')}
  pull.y=null;pull.dy=0;
});

/* ---------- connexion réseau ---------- */
function net(){$('#net').hidden=navigator.onLine!==false}
window.addEventListener('offline',function(){$('#net').hidden=false});
window.addEventListener('online',function(){$('#net').hidden=true;toast('Connexion rétablie')});

var setupDone=false;try{setupDone=localStorage.getItem('crp-setup')==='1'}catch(e){}
S.route='welcome';
applySettings();net();render();
})();
